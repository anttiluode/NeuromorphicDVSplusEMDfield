<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuromorphic DVS + EMD Motion Field</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12; --pan: #12121e; --line: #23233a;
    --cyan: #2ec5ff; --magenta: #ff3b6b; --txt: #e7e7f5; --dim: #6b6b85;
    --font: "IBM Plex Mono", monospace;
  }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--txt);
    font-family: var(--font); display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 { color: var(--cyan); margin: 0 0 5px 0; font-size: 2rem; font-weight: 400;}
  .ethos { color: #f5c542; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; }
  
  .controls { display: flex; gap: 15px; margin-bottom: 20px; background: var(--pan); padding: 15px; border: 1px solid var(--line); border-radius: 8px; width: 100%; max-width: 800px; justify-content: space-between; }
  button { background: transparent; color: var(--txt); border: 1px solid var(--dim); padding: 8px 16px; font-family: inherit; cursor: pointer; border-radius: 4px; }
  button:hover { border-color: var(--cyan); color: var(--cyan); }
  
  .slider-group { display: flex; flex-direction: column; gap: 5px; }
  .slider-group label { font-size: 0.75rem; color: var(--dim); }
  
  .video-container { position: relative; display: inline-block; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; }
  video { display: none; } /* Hidden, source only */
  canvas { display: block; }
  
  .metrics { display: flex; gap: 20px; margin-top: 15px; width: 100%; max-width: 800px; }
  .metric-card { flex: 1; background: var(--pan); border: 1px solid var(--line); border-radius: 8px; padding: 15px; text-align: center; }
  .metric-val { font-size: 1.5rem; font-weight: 600; color: var(--cyan); margin-top: 5px; }
</style>
</head>
<body>

<header>
  <h1>Neuromorphic DVS + EMD Field</h1>
  <span class="ethos">Hassenstein–Reichardt · Koopman Angular Momentum</span>
</header>

<div class="controls">
  <button id="btnStart">Start Camera</button>
  
  <div class="slider-group">
    <label>DVS Noise Gate (Sparsity)</label>
    <input type="range" id="noiseGate" min="2" max="40" value="12">
  </div>
  <div class="slider-group">
    <label>EMD Lag (Frames)</label>
    <input type="range" id="lagSlider" min="1" max="10" value="3">
  </div>
</div>

<div class="video-container">
  <video id="video" width="640" height="480" autoplay playsinline muted></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>

<div class="metrics">
  <div class="metric-card">
    <div style="font-size: 0.8rem; color: var(--dim);">Active DVS Events (Delta-Code)</div>
    <div class="metric-val" id="event-rate">0%</div>
  </div>
  <div class="metric-card">
    <div style="font-size: 0.8rem; color: var(--dim);">Net Field Chirality (Pan)</div>
    <div class="metric-val" id="net-pan" style="color: var(--magenta);">0.00</div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  // Downsample grid for the EMD (e.g., 64x48 grid over a 640x480 feed)
  const step = 10; 
  const cols = 640 / step;
  const rows = 480 / step;
  const N = cols * rows;

  let isRunning = false;
  let historyBuffer = [];
  let prevRaw = new Float32Array(N);

  // UI State
  let noiseGate = 12;
  let EMD_LAG = 3;

  document.getElementById('noiseGate').oninput = (e) => noiseGate = parseInt(e.target.value);
  document.getElementById('lagSlider').oninput = (e) => EMD_LAG = parseInt(e.target.value);

  document.getElementById('btnStart').onclick = async () => {
    if (isRunning) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      isRunning = true;
      document.getElementById('btnStart').innerText = "Running...";
      document.getElementById('btnStart').style.color = "var(--cyan)";
      requestAnimationFrame(processFrame);
    } catch (err) {
      alert("Camera access denied.");
    }
  };

  function processFrame() {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) {
      requestAnimationFrame(processFrame); return;
    }

    // Mirror video and grab raw pixel data
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();
    
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    
    // Clear canvas to draw the dark DVS representation
    ctx.fillStyle = "rgba(10, 10, 18, 0.9)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let currentGrid = new Float32Array(N);
    let activeEvents = 0;

    // 1. DVS Sparsity Layer (Delta-Coding)
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = x * step;
        const py = y * step;
        const idx = (py * canvas.width + px) * 4;
        
        // Grayscale brightness
        const bright = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
        const flatIdx = y * cols + x;
        
        const diff = Math.abs(bright - prevRaw[flatIdx]);
        
        // The DVS Noise Gate (spikes only on significant change)
        if (diff > noiseGate) {
          currentGrid[flatIdx] = bright / 255.0; // Normalize
          activeEvents++;
          
          // Draw the raw "event" as a faint white dot (like DVS polarity)
          ctx.fillStyle = bright > prevRaw[flatIdx] ? "rgba(255,255,255,0.4)" : "rgba(100,100,100,0.4)";
          ctx.fillRect(px, py, step, step);
        } else {
          currentGrid[flatIdx] = 0; // Silent
        }
        
        prevRaw[flatIdx] = bright;
      }
    }

    // Buffer management
    historyBuffer.push(currentGrid);
    if (historyBuffer.length > EMD_LAG + 2) {
      historyBuffer.shift();
    }

    // 2. The Hassenstein-Reichardt / Koopman EMD Layer
    let netPan = 0;

    if (historyBuffer.length > EMD_LAG) {
      const curr = historyBuffer[historyBuffer.length - 1];
      const lag = historyBuffer[historyBuffer.length - 1 - EMD_LAG];

      ctx.lineWidth = 1.5;

      for (let y = 1; y < rows - 1; y++) {
        for (let x = 1; x < cols - 1; x++) {
          const i = y * cols + x;
          
          // If no recent activity here, skip math (O(K) sparsity profit)
          if (curr[i] === 0 && lag[i] === 0) continue;

          // HORIZONTAL EMD (X-axis)
          // L_x = right(t)*center(t-lag) - center(t)*right(t-lag)
          const right = y * cols + (x + 1);
          const L_x = (curr[right] * lag[i]) - (curr[i] * lag[right]);

          // VERTICAL EMD (Y-axis)
          // L_y = down(t)*center(t-lag) - center(t)*down(t-lag)
          const down = (y + 1) * cols + x;
          const L_y = (curr[down] * lag[i]) - (curr[i] * lag[down]);

          // Filter out mathematical noise
          if (Math.abs(L_x) < 0.01 && Math.abs(L_y) < 0.01) continue;

          // Draw the Optical Flow Vector
          const px = x * step + (step/2);
          const py = y * step + (step/2);
          
          // Scale vector length for visibility
          const vx = L_x * 80; 
          const vy = L_y * 80;

          // Color coding based on primary direction
          if (Math.abs(L_x) > Math.abs(L_y)) {
             ctx.strokeStyle = L_x > 0 ? "#2ec5ff" : "#ff3b6b"; // Cyan Right, Magenta Left
          } else {
             ctx.strokeStyle = L_y > 0 ? "#42f5a1" : "#f5c542"; // Green Down, Yellow Up
          }

          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + vx, py + vy);
          ctx.stroke();

          netPan += L_x;
        }
      }
    }

    // Metrics Update
    const sparsityPct = ((activeEvents / N) * 100).toFixed(1);
    document.getElementById('event-rate').innerText = `${sparsityPct}%`;
    document.getElementById('net-pan').innerText = netPan.toFixed(2);

    requestAnimationFrame(processFrame);
  }
</script>
</body>
</html>
